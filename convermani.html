<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КонверМани | ConverterMoney | 转换金钱</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --transition-speed: 0.4s;
            --blur-amount: 40px;
            --border-radius: 24px;
            --border-radius-sm: 16px;
            --border-radius-xs: 12px;
        }

        /* Темная тема (по умолчанию) */
        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --bg-glass: rgba(28, 28, 30, 0.65);
            --bg-glass-hover: rgba(44, 44, 46, 0.75);
            --bg-glass-active: rgba(58, 58, 60, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-color-active: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #98989d;
            --text-tertiary: #636366;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --accent-gradient: linear-gradient(135deg, #0a84ff, #5e5ce6);
            --success: #30d158;
            --warning: #ff9f0a;
            --error: #ff453a;
            --gold: #ffd60a;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(10, 132, 255, 0.15);
        }

        /* Светлая тема */
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8ed;
            --bg-glass: rgba(255, 255, 255, 0.65);
            --bg-glass-hover: rgba(255, 255, 255, 0.8);
            --bg-glass-active: rgba(232, 232, 237, 0.9);
            --border-color: rgba(0, 0, 0, 0.06);
            --border-color-active: rgba(0, 0, 0, 0.12);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #aeaeb2;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --accent-gradient: linear-gradient(135deg, #0071e3, #5e5ce6);
            --success: #34c759;
            --warning: #ff9f0a;
            --error: #ff3b30;
            --gold: #f0c000;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 40px rgba(0, 113, 227, 0.1);
        }

        /* Midnight тема */
        [data-theme="midnight"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-tertiary: #1a1a3e;
            --bg-glass: rgba(18, 18, 42, 0.7);
            --bg-glass-hover: rgba(26, 26, 62, 0.8);
            --bg-glass-active: rgba(38, 38, 78, 0.85);
            --border-color: rgba(100, 100, 255, 0.1);
            --border-color-active: rgba(100, 100, 255, 0.2);
            --text-primary: #e8e8ff;
            --text-secondary: #8888bb;
            --text-tertiary: #555588;
            --accent: #6c5ce7;
            --accent-hover: #8b7cf0;
            --accent-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --success: #00cec9;
            --warning: #fdcb6e;
            --error: #fd79a8;
            --gold: #f7c948;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 32px rgba(108, 92, 231, 0.15);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 40px rgba(108, 92, 231, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background var(--transition-speed) ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 24px;
        }

        .settings-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
            font-size: 1.2rem;
            position: relative;
        }

        .settings-btn:hover {
            background: var(--bg-glass-hover);
            border-color: var(--border-color-active);
            transform: translateY(-1px);
        }

        .settings-btn:active {
            transform: scale(0.95);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 52px;
            right: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            padding: 8px;
            min-width: 180px;
            box-shadow: var(--shadow-md);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 100;
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: var(--border-radius-xs);
            font-size: 0.9rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-align: left;
        }

        .dropdown-item:hover {
            background: var(--bg-glass-hover);
        }

        .dropdown-item.active {
            background: var(--accent);
            color: white;
        }

        .dropdown-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-dark { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.2); }
        .dot-light { background: #f5f5f7; border: 1px solid rgba(0,0,0,0.2); }
        .dot-midnight { background: #12122a; border: 1px solid rgba(100,100,255,0.5); }

        .converter-card {
            background: var(--bg-glass);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 32px 28px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            transition: all var(--transition-speed) ease;
        }

        .converter-card:hover {
            border-color: var(--border-color-active);
        }

        .card-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .brand {
            font-size: 2rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .brand.cn {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .currency-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .section-label .dot.output {
            background: var(--accent);
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .currency-select {
            flex: 1;
            padding: 14px 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xs);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2398989d' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 35px;
            transition: all var(--transition-speed) ease;
        }

        .currency-select:hover {
            border-color: var(--border-color-active);
            background: var(--bg-glass-hover);
        }

        .currency-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.1);
        }

        .currency-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .amount-input {
            width: 100%;
            padding: 18px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xs);
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            font-family: inherit;
            outline: none;
            transition: all var(--transition-speed) ease;
            letter-spacing: -0.5px;
            margin-top: 8px;
        }

        .amount-input:focus {
            border-color: var(--accent);
            background: var(--bg-glass-hover);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.08);
        }

        .amount-input::placeholder {
            color: var(--text-tertiary);
        }

        .amount-input.result {
            background: var(--bg-glass-active);
            border-color: var(--accent);
            color: var(--accent);
            font-size: 2rem;
        }

        .swap-area {
            display: flex;
            justify-content: center;
            margin: -8px 0;
            position: relative;
            z-index: 2;
        }

        .swap-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed) ease;
            box-shadow: var(--shadow-sm);
        }

        .swap-btn:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .swap-btn:active {
            transform: scale(0.95) rotate(180deg);
        }

        .swap-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.4s ease;
        }

        .swap-btn:hover svg {
            transform: rotate(180deg);
        }

        .info-row {
            margin-top: 24px;
            padding: 16px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-xs);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rate-badge {
            background: var(--bg-glass-active);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-dot.error {
            background: var(--error);
            animation: none;
        }

        .refresh-link {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .refresh-link:hover {
            background: var(--bg-glass-hover);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: var(--error);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-md);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .converter-card {
                padding: 24px 18px;
            }
            .amount-input {
                font-size: 1.4rem;
            }
            .amount-input.result {
                font-size: 1.6rem;
            }
            .brand {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

            tagline: document.getElementById('tagline'),
            fromLabel: document.getElementById('fromLabel'),
            toLabel: document.getElementById('toLabel'),
            rateLabel: document.getElementById('rateLabel'),
            refreshText: document.getElementById('refreshText'),
            exchangeRate: document.getElementById('exchangeRate'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            fromAmount: document.getElementById('fromAmount'),
            toAmount: document.getElementById('toAmount'),
            fromCurrency: document.getElementById('fromCurrency'),
            toCurrency: document.getElementById('toCurrency'),
            toast: document.getElementById('toast')
        };

        // ==================== Функции темы ====================
        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('convTheme', theme);
            document.body.setAttribute('data-theme', theme);
            
            document.querySelectorAll('#themeMenu .dropdown-item').forEach(item => {
                item.classList.toggle('active', item.dataset.theme === theme);
            });
        }

        // ==================== Функции языка ====================
        function updateCurrencies(lang) {
            const currencies = translations[lang].currencies;
            [elements.fromCurrency, elements.toCurrency].forEach(select => {
                const currentValue = select.value;
                select.innerHTML = '';
                Object.entries(currencies).forEach(([code, name]) => {
                    const option = document.createElement('option');
                    option.value = code;
                    option.textContent = name;
                    if (code === currentValue) option.selected = true;
                    select.appendChild(option);
                });
            });
        }

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('convLang', lang);
            const t = translations[lang];
            
            elements.brandName.textContent = t.brand;
            elements.tagline.textContent = t.tagline;
            elements.fromLabel.textContent = t.fromLabel;
            elements.toLabel.textContent = t.toLabel;
            elements.rateLabel.textContent = t.rateLabel;
            elements.refreshText.textContent = t.refreshText;
            
            if (lang === 'cn') {
                elements.brandName.classList.add('cn');
            } else {
                elements.brandName.classList.remove('cn');
            }
            
            updateCurrencies(lang);
            
            document.querySelectorAll('#langMenu .dropdown-item').forEach(item => {
                item.classList.toggle('active', item.dataset.lang === lang);
            });
            
            updateStatus();
        }

        function updateStatus() {
            const t = translations[currentLang];
            const status = elements.statusText.textContent;
            if (status.includes('Загрузка') || status.includes('Loading') || status.includes('加载')) {
                elements.statusText.textContent = t.statusLoading;
            } else if (status.includes('Актуально') || status.includes('Up to date') || status.includes('已更新')) {
                elements.statusText.textContent = t.statusReady;
            } else if (status.includes('Ошибка') || status.includes('Error') || status.includes('错误')) {
                elements.statusText.textContent = t.statusError;
            }
        }

        // ==================== Toast ====================
        function showToast(message) {
            elements.toast.textContent = message;
            elements.toast.classList.add('show');
            setTimeout(() => elements.toast.classList.remove('show'), 3000);
        }

        // ==================== API ====================
        async function fetchRates(showLoading = true) {
            if (API_KEY === 'ВАШ_API_КЛЮЧ') {
                elements.statusDot.className = 'status-dot error';
                elements.statusText.textContent = 'Нет API ключа';
                showToast('Добавьте свой API ключ от exchangerate-api.com');
                return;
            }

            if (showLoading) {
                elements.statusDot.className = 'status-dot';
                elements.statusText.textContent = translations[currentLang].statusLoading;
            }

            try {
                const response = await fetch(`${BASE_URL}/latest/USD`);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                if (data.result === 'success') {
                    currentRates = data.conversion_rates;
                    elements.statusDot.className = 'status-dot';
                    elements.statusText.textContent = translations[currentLang].statusReady;
                    convert();
                } else {
                    throw new Error('API error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                elements.statusDot.className = 'status-dot error';
                elements.statusText.textContent = translations[currentLang].statusError;
                if (showLoading) {
                    showToast(translations[currentLang].errorMsg);
                }
            }
        }

        function convert() {
            const amount = parseFloat(elements.fromAmount.value) || 0;
            const from = elements.fromCurrency.value;
            const to = elements.toCurrency.value;

            if (amount < 0) {
                elements.fromAmount.value = Math.abs(amount);
                return;
            }

            if (Object.keys(currentRates).length === 0) return;

            const amountInUSD = from === 'USD' ? amount : amount / currentRates[from];
            const result = to === 'USD' ? amountInUSD : amountInUSD * currentRates[to];

            elements.toAmount.style.transform = 'scale(1.02)';
            setTimeout(() => {
                elements.toAmount.style.transform = 'scale(1)';
                elements.toAmount.value = result < 0.01 ? result.toFixed(6) : result.toFixed(2);
            }, 100);

            const rate = to === 'USD' ? 
                (1 / currentRates[from]) : 
                (currentRates[to] / currentRates[from]);
            
            elements.exchangeRate.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
        }

        // ==================== Обработчики ====================
        elements.themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            elements.themeMenu.classList.toggle('show');
            elements.langMenu.classList.remove('show');
        });

        document.getElementById('themeMenu').addEventListener('click', (e) => {
            if (e.target.classList.contains('dropdown-item')) {
                applyTheme(e.target.dataset.theme);
                elements.themeMenu.classList.remove('show');
            }
        });

        elements.langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            elements.langMenu.classList.toggle('show');
            elements.themeMenu.classList.remove('show');
        });

        document.getElementById('langMenu').addEventListener('click', (e) => {
            if (e.target.classList.contains('dropdown-item')) {
                applyLanguage(e.target.dataset.lang);
                elements.langMenu.classList.remove('show');
            }
        });

        document.addEventListener('click', () => {
            elements.themeMenu.classList.remove('show');
            elements.langMenu.classList.remove('show');
        });

        elements.fromAmount.addEventListener('input', convert);
        elements.fromCurrency.addEventListener('change', convert);
        elements.toCurrency.addEventListener('change', convert);

        document.getElementById('swapBtn').addEventListener('click', () => {
            const tempCurrency = elements.fromCurrency.value;
            elements.fromCurrency.value = elements.toCurrency.value;
            elements.toCurrency.value = tempCurrency;
            
            const tempAmount = elements.fromAmount.value;
            elements.fromAmount.value = elements.toAmount.value.replace(/[^0-9.]/g, '');
            
            convert();
        });

        document.getElementById('refreshBtn').addEventListener('click', () => fetchRates(true));

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                convert();
            }
        });

        // ==================== Инициализация ====================
        applyTheme(currentTheme);
        applyLanguage(currentLang);
        fetchRates(true);
        
        updateTimer = setInterval(() => fetchRates(false), 600000);

        window.addEventListener('beforeunload', () => {
            clearInterval(updateTimer);
        });
    </script>
</body>
</html>
